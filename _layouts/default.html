<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">项目</a>
      <a href="{{ '/notes/' | relative_url }}">股权投资札记</a>
      <a href="{{ '/travel/' | relative_url }}">旅行计划&amp;札记</a>
    </nav>
  </header>

  <main class="site-main{% if page.wide %} site-main--wide{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ site.time | date: '%Y' }} {{ site.author }} · 由 GitHub Pages 驱动</p>
  </footer>
</body>
</html>
