---
layout: default
---
<article class="project-detail">
  <p class="back"><a href="{{ '/' | relative_url }}">← 返回项目列表</a></p>
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}
    </p>
  </header>

  {{ content }}

  {% if page.link %}<p><a class="btn" href="{{ page.link }}">查看 / 试玩 →</a></p>{% endif %}
</article>
