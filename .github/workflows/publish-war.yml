name: publish-war

on:
  push:
    paths:
      - .publish/war.url

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack
        run: |
          set -euo pipefail
          URL="$(head -n1 .publish/war.url | tr -d '\r\n ')"
          echo "payload: $URL"
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/war.b64
          base64 -d /tmp/war.b64 > /tmp/war.tar.gz
          rm -rf war-3d-timeline
          mkdir -p war-3d-timeline
          tar -xzf /tmp/war.tar.gz -C war-3d-timeline
          find war-3d-timeline -type f | sort
          du -sh war-3d-timeline
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A war-3d-timeline
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "publish: war-3d-timeline"
          git push
