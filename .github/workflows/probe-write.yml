name: probe-write
on:
  push:
    paths:
      - '.github/workflows/probe-write.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write probe file
        run: |
          mkdir -p .publish-probe
          echo ok > .publish-probe/ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .publish-probe/ok.txt
          git commit -m "probe: actions write test" || echo "nothing to commit"
          git push
