name: publish-kaibox

on:
  push:
    paths:
      - .publish/kaibox.url

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize kaibox
        run: |
          set -euo pipefail
          URL="$(tr -d '\r\n ' < .publish/kaibox.url)"
          mkdir -p kaibox
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/kaibox.b64
          base64 -d /tmp/kaibox.b64 > kaibox/index.html
          test -s kaibox/index.html
          ls -l kaibox/index.html
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaibox/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "publish: kaibox"
          git push
