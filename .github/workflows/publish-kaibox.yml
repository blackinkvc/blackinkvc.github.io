name: publish-kaibox

on:
  push:
    paths:
      - .publish/kaibox.url

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch payload
        run: |
          set -euo pipefail
          URL="$(head -n1 .publish/kaibox.url | tr -d '\r\n ')"
          echo "payload: $URL"
          mkdir -p kaibox
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o kaibox/app.b64
          wc -c kaibox/app.b64
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaibox/app.b64
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "publish: kaibox payload"
          git push
