name: publish-hazard

on:
  push:
    paths:
      - .publish/hazard.url

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack
        run: |
          set -euo pipefail
          URL="$(head -n1 .publish/hazard.url | tr -d '\r\n ')"
          echo "payload: $URL"
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/hazard.b64
          base64 -d /tmp/hazard.b64 > /tmp/hazard.tar.gz
          rm -rf hazard-3d-globe
          mkdir -p hazard-3d-globe
          tar -xzf /tmp/hazard.tar.gz -C hazard-3d-globe
          find hazard-3d-globe -type f | sort
          du -sh hazard-3d-globe
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f hazard-3d-globe
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "publish: hazard-3d-globe"
          git push
