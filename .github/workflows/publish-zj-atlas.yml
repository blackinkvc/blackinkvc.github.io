name: publish-zj-atlas

on:
  push:
    paths:
      - .publish/open-atlas.url

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack
        run: |
          set -euo pipefail
          URL="$(head -n1 .publish/open-atlas.url | tr -d '\r\n ')"
          echo "payload: $URL"
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/zj.b64
          base64 -d /tmp/zj.b64 > /tmp/zj.tar.gz
          rm -rf open-atlas
          mkdir -p open-atlas
          tar -xzf /tmp/zj.tar.gz -C open-atlas
          ls -la open-atlas
          du -sh open-atlas
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f open-atlas
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "publish: open-atlas"
          git push
