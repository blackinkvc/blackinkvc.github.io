name: Update popular ranking

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 UTC 03:17 更新一次热门排名
  workflow_dispatch:

permissions:
  contents: write

jobs:
  popular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate popular.json
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: python scripts/gen_popular.py

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/popular.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: 更新热门排名数据 (popular.json)"
            git push
          fi
