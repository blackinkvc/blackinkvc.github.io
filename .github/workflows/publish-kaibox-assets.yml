name: publish-kaibox-assets

on:
  push:
    paths:
      - .publish/kaibox-assets.url

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          set -euo pipefail
          URL="$(head -n1 .publish/kaibox-assets.url | tr -d '\r\n ')"
          echo "payload: $URL"
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/assets.b64
          base64 -d /tmp/assets.b64 > /tmp/assets.zip
          unzip -oq /tmp/assets.zip -d kaibox
          find kaibox/assets -type f | wc -l
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaibox/assets
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "publish: kaibox assets"
          git push
