# 站点基础信息
title: 我的项目集
description: 个人项目存档与展示
author: blackinkvc

# 部署相关：
# - 仓库名为 用户名.github.io 时，baseurl 留空（""）
# - 仓库名是其他名字（如 personal-site）时，baseurl 改为 "/personal-site"
baseurl: ""
url: "https://blackinkvc.github.io"

# 构建设置
markdown: kramdown

# 项目集合：每个项目一个 _projects/xxx.md，首页自动生成卡片
collections:
  projects:
    output: true
    permalink: /projects/:name/
  notes:
    output: true
    permalink: /notes/:name/
  # 旅行计划&札记：每个计划一个 _travel/xxx.md（数据条目），
  # 实际页面是 travel/<slug>/ 下的独立静态站点
  travel:
    output: false

exclude:
  - README.md
  - .gitignore
