<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蛆生 · 联机肉鸽</title>
<style>
  :root{
    --bg:#0e0c08; --panel:#1c1810; --ink:#ecdfc6; --muted:#9c8c72;
    --line:#3a2c1c; --accent:#d9a441; --accent2:#8a6d2f;
    --win:#7fd97f; --die:#ff8a6b; --bar:#2a2014;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:radial-gradient(120% 120% at 50% 0%,#241b12 0%,#0e0c08 100%);
    color:var(--ink); font-family:"Noto Serif CJK SC",STKaiti,KaiTi,Georgia,serif; overflow:hidden;}
  #game{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* 顶部状态栏 */
  #hud{display:flex; gap:10px; align-items:center; padding:8px 12px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:rgba(28,24,16,.6);}
  .stat{display:flex; flex-direction:column; min-width:62px;}
  .stat .lab{font-size:10px; color:var(--muted); letter-spacing:1px;}
  .stat .val{font-size:17px; font-weight:bold; color:var(--accent);}
  .bar{height:5px; border-radius:3px; background:var(--bar); margin-top:3px; overflow:hidden; width:62px;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .3s;}
  .bar.low i{background:linear-gradient(90deg,#a8432a,var(--die));}
  .bar.high i{background:linear-gradient(90deg,#a8432a,var(--die));}
  #roomTag{margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap;}
  #phaseTag{font-size:11px; color:var(--accent);}
  /* 倒计时 */
  #timerTag{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--accent); white-space:nowrap;
    border:1px solid var(--accent2); border-radius:7px; padding:3px 9px; background:rgba(217,164,65,.08);}
  #timerTag .tnum{font-size:16px; font-weight:bold; font-variant-numeric:tabular-nums; letter-spacing:1px;}
  #timerTag .tbar{width:46px; height:4px; border-radius:3px; background:var(--bar); overflow:hidden;}
  #timerTag .tbar i{display:block; height:100%; background:linear-gradient(90deg,var(--die),var(--accent)); transition:width .25s linear;}
  #timerTag.warn{color:var(--die); border-color:var(--die); background:rgba(255,138,107,.1); animation:tpulse 1s infinite;}
  @keyframes tpulse{0%,100%{opacity:1;} 50%{opacity:.55;}}

  /* 主体：场景+日志 | 侧栏聊天/玩家 */
  #main{flex:1 1 auto; display:flex; min-height:0;}
  #left{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; padding:14px; overflow:hidden;}
  #scene{white-space:pre-line; line-height:1.65; font-size:14px; color:var(--ink); flex-shrink:0; max-height:30vh; overflow-y:auto;
    background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:10px 13px; min-height:70px;}
  #eventBox{margin-top:8px; flex-shrink:0; display:none;}
  #eventBox .eb-head{font-size:12px; color:var(--accent); margin-bottom:4px;}
  #eventBox .ev{background:rgba(0,0,0,.3); border-left:3px solid var(--accent); border-radius:6px; padding:5px 9px; margin-bottom:4px; font-size:12px;}
  #eventBox .ev .nm{color:var(--accent); font-weight:bold;}
  #eventBox .ev.die{border-left-color:var(--die);} #eventBox .ev.die .nm{color:var(--die);}
  #eventBox .ev.win{border-left-color:var(--win);} #eventBox .ev.win .nm{color:var(--win);}
  #eventBox .ev .dl{font-size:11px; color:var(--muted);}

  #choices{margin-top:8px; flex-shrink:0; display:flex; flex-direction:column; gap:4px;}
  .choice{font-family:inherit; text-align:left; padding:5px 9px; border-radius:7px; line-height:1.3;
    border:1px solid var(--line); background:linear-gradient(135deg,rgba(217,164,65,.14),rgba(138,109,47,.08));
    color:var(--ink); font-size:12.5px; cursor:pointer; transition:transform .08s, border-color .15s; display:flex; justify-content:space-between; gap:6px; align-items:center;}
  .choice:hover{border-color:var(--accent); transform:translateY(-1px);}
  .choice .tag{font-size:9px; color:var(--accent); border:1px solid var(--accent2); border-radius:5px; padding:0 5px; white-space:nowrap;}
  .choice .vcount{font-size:10px; color:var(--muted); white-space:nowrap;}
  .choice.mine{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .choice.win-final{border-color:var(--win); box-shadow:0 0 0 2px var(--win) inset, 0 0 16px rgba(127,217,127,.6); animation:winfinal .5s ease;}
  @keyframes winfinal{0%{transform:scale(1);}40%{transform:scale(1.05);}100%{transform:scale(1);}}
  .choice .crown{color:var(--win); font-weight:bold; font-size:12px; margin-right:4px;}

  #log{flex:1 1 auto; min-height:0; overflow-y:auto; margin-top:10px; padding-right:4px; border-top:1px solid var(--line); padding-top:8px;}
  .log-line{font-size:12.5px; line-height:1.6; color:var(--ink); padding:2px 0; border-bottom:1px dotted rgba(58,44,28,.5);}
  .log-line.win{color:var(--win);} .log-line.die{color:var(--die);}

  /* 侧栏 */
  #side{width:210px; border-left:1px solid var(--line); display:flex; flex-direction:column; background:rgba(0,0,0,.18);}
  #players{padding:8px 10px; border-bottom:1px solid var(--line);}
  #players .ph{font-size:11px; color:var(--muted); margin-bottom:5px;}
  .pcard{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:3px 0;}
  .pcard .dot{width:8px; height:8px; border-radius:50%; background:var(--accent);}
  .pcard.off .dot{background:#555;} .pcard.off{opacity:.5;}
  .pcard .host{font-size:9px; background:var(--accent); color:#1a1206; border-radius:3px; padding:0 4px;}
  .pcard .vmark{margin-left:auto; color:var(--win); font-size:11px;}
  #chat{flex:1 1 auto; overflow-y:auto; padding:8px 10px; font-size:12px;}
  #chat .cmsg{margin-bottom:5px; line-height:1.5;}
  #chat .cn{color:var(--accent); font-weight:bold;}
  #chatInput{display:flex; border-top:1px solid var(--line);}
  #chatInput input{flex:1; background:rgba(0,0,0,.4); border:none; color:var(--ink); padding:8px 10px; font-family:inherit; font-size:12px; outline:none;}
  #chatInput button{background:var(--accent2); color:#1a1206; border:none; padding:0 12px; font-family:inherit; cursor:pointer;}

  /* 覆盖层（登录/大厅/结算） */
  .overlay{position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(40,30,20,.94), rgba(14,12,8,.98)); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; padding:20px; overflow-y:auto;}
  .overlay.hidden{display:none;}
  .hidden{display:none !important;}
  .logo{font-size:40px; font-weight:800; color:var(--accent); letter-spacing:3px; text-shadow:0 2px 14px rgba(217,164,65,.4); margin-bottom:6px;}
  .maggot-ico{display:inline-block; filter:brightness(0) invert(1);}
  .subtitle{color:var(--muted); font-size:13px; margin-bottom:22px; text-align:center; max-width:430px; line-height:1.7;}
  .field{width:280px; margin-bottom:12px;}
  .field input{width:100%; padding:11px 14px; border-radius:9px; border:1px solid var(--line); background:rgba(0,0,0,.35); color:var(--ink); font-size:15px; font-family:inherit; outline:none;}
  .field input:focus{border-color:var(--accent);}
  .btn{font-family:inherit; padding:11px 26px; border-radius:9px; border:none; font-size:15px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a1206; transition:transform .1s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn.ready{box-shadow:0 0 0 2px var(--accent), 0 0 18px rgba(217,164,65,.5); animation:bready 1.4s ease-in-out infinite;}
  @keyframes bready{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .btn.secondary{background:rgba(255,255,255,.1); color:var(--ink);}
  .players{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; max-width:480px; margin:16px 0;}
  .pcard.big{background:rgba(0,0,0,.35); border-radius:9px; padding:9px 13px; display:flex; align-items:center; gap:8px; border:1px solid var(--line);}
  .hint{color:var(--muted); font-size:12px; margin-top:8px; text-align:center;}

  /* 大厅模式选择 */
  .mode-box{margin:6px 0 4px; text-align:center;}
  .mode-title{color:var(--accent); font-size:13px; margin-bottom:8px; letter-spacing:1px;}
  .mode-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:520px;}
  .mode-btn{font-family:inherit; cursor:pointer; flex:1 1 150px; min-width:140px; max-width:165px;
    background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:10px; color:var(--ink);
    padding:10px 12px; display:flex; flex-direction:column; gap:3px; align-items:flex-start; transition:border-color .15s, transform .08s, background .15s;}
  .mode-btn b{font-size:15px; color:var(--accent);}
  .mode-btn span{font-size:10.5px; color:var(--muted); line-height:1.4; text-align:left;}
  .mode-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .mode-btn.active{border-color:var(--accent); background:linear-gradient(135deg,rgba(217,164,65,.18),rgba(138,109,47,.1)); box-shadow:0 0 0 1px var(--accent) inset;}
  .mode-btn.locked{opacity:.5; cursor:default;}
  .mode-btn.locked:hover{transform:none; border-color:var(--line);}

  /* 结局 */
  #result .res-title{font-size:26px; font-weight:800; margin-bottom:6px; color:var(--accent);}
  #result .res-sub{color:var(--muted); font-size:13px; margin-bottom:10px;}
  #result .end-title{font-size:18px; margin-bottom:14px;}
  #result .chronicle{text-align:left; max-width:520px; max-height:40vh; overflow-y:auto; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:14px;}
  #result .chronicle .ch-title{color:var(--accent); font-size:13px; margin-bottom:8px;}
  #result .ch-item{font-size:13px; line-height:1.7; color:var(--ink);}
  #result .ver-list{text-align:left; max-width:520px; max-height:24vh; overflow-y:auto; background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin-bottom:14px;}
  #result .v-item{font-size:12px; color:var(--muted); line-height:1.6;}

  #toast{position:fixed; top:64px; left:50%; transform:translateX(-50%); background:rgba(194,86,46,.92); padding:8px 18px; border-radius:8px; z-index:30; opacity:0; transition:opacity .3s; font-size:13px;}
  #toast.show{opacity:1;}

  /* 回合最终选项揭晓特效：先展示选择效果（结果弹窗），结束后蛆绕结果转圈 */
  #revealDim{position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:24; opacity:0; transition:opacity .25s; pointer-events:none;}
  #revealDim.show{opacity:1;}
  #revealStage{position:fixed; inset:0; z-index:26; pointer-events:none;}
  #revealBox{position:absolute; border:2px solid var(--win); border-radius:14px; text-align:center;
    background:linear-gradient(135deg,rgba(127,217,127,.16),rgba(217,164,65,.12));
    box-shadow:0 0 26px rgba(127,217,127,.8), inset 0 0 14px rgba(127,217,127,.2);
    padding:16px 26px; opacity:0; transform:translateX(-50%) scale(.82); transition:opacity .22s, transform .22s;}
  #revealBox.show{opacity:1; transform:translateX(-50%) scale(1);}
  #revealBox .rb-tag{display:block; font-size:12px; color:var(--win); letter-spacing:3px; margin-bottom:4px;}
  #revealBox .rb-label{display:block; font-size:18px; font-weight:800; color:var(--ink); line-height:1.4;}
  #revealBox .rb-delta{display:block; font-size:13px; color:var(--accent); margin-top:7px; font-weight:bold;}
  #revealBox .rb-sub{display:block; font-size:11px; color:var(--muted); margin-top:3px;}
  .reveal-worm{position:absolute; font-size:22px; line-height:1;
    filter:brightness(0) invert(1) drop-shadow(0 0 7px #fff) drop-shadow(0 0 13px #bfe);
    animation:wormOrbit 1.5s linear forwards;}
  @keyframes wormOrbit{
    0%   { top:-16px; left:0%;   transform:translateX(-50%); }
    25%  { top:0%;   left:100%;  transform:translate(0,-50%); }
    50%  { top:100%; left:100%;  transform:translate(-50%,0); }
    75%  { top:100%; left:0%;   transform:translate(0,-50%); }
    100% { top:-16px; left:0%;  transform:translateX(-50%); }
  }

  @media (max-width:560px){
    #side{width:0; display:none;}
    .stat{min-width:52px;} .bar{width:52px;}
  }
</style>
</head>
<body>
<div id="game">
  <div id="revealDim" class="hidden"></div>
  <div id="revealStage" class="hidden">
    <div id="revealBox">
      <span class="rb-tag">🎯 本回合命运</span>
      <span class="rb-label"></span>
      <span class="rb-delta"></span>
      <span class="rb-sub"></span>
      <span class="reveal-worm">🪱</span>
    </div>
  </div>
  <div id="hud" class="hidden">
    <div class="stat"><span class="lab">体力</span><span class="val" id="vFood">20</span><div class="bar" id="bFood"><i style="width:20%"></i></div></div>
    <div class="stat"><span class="lab">体型</span><span class="val" id="vGrow">1</span><div class="bar" id="bGrow"><i style="width:1%"></i></div></div>
    <div class="stat"><span class="lab">探索</span><span class="val" id="vExp">0</span><div class="bar" id="bExp"><i style="width:0%"></i></div></div>
    <div class="stat"><span class="lab">天数</span><span class="val" id="vDay">0</span></div>
    <div class="stat"><span class="lab">版本</span><span class="val" id="vVer" style="font-size:14px">v1.8</span></div>
    <span id="phaseTag"></span>
    <span id="timerTag" class="hidden"></span>
    <span id="roomTag">房间 --</span>
  </div>

  <div id="main" class="hidden">
    <div id="left">
      <div id="scene">…</div>
      <div id="eventBox"><div class="eb-head">⚡ 本回合 · 周遭骤变</div><div id="eventList"></div></div>
      <div id="choices"></div>
      <div id="log"></div>
    </div>
    <div id="side">
      <div id="players"><div class="ph">🪱 同窝蛆（<span id="pc">0</span>/6）</div><div id="playerList"></div></div>
      <div id="chat"></div>
      <div id="chatInput"><input id="chatText" placeholder="说点什么…" maxlength="200"><button id="chatSend">发</button></div>
    </div>
  </div>
</div>

<!-- 登录 -->
<div class="overlay" id="login">
  <div class="logo"><span class="maggot-ico">🪱</span> 蛆生 · 群蛆乱舞</div>
  <div class="subtitle">联机肉鸽文字版 · 最多 6 人无需注册<br>同窝的蛆共享一局，每回合大家一起投票抉择命运——抢食、躲天敌、轮回羽化，看谁活得最久、最先化蛹成蝇。</div>
  <div class="field"><input id="nameInput" placeholder="给自己起个蛆名" maxlength="12"></div>
  <div class="field"><input id="roomInput" placeholder="房间号（留空随机）" maxlength="4"></div>
  <button class="btn" id="joinBtn">钻入腐肉世界</button>
  <div class="hint">建房后把房间号发给朋友，即可一起联机</div>
</div>

<!-- 大厅 -->
<div class="overlay hidden" id="lobby">
  <div class="logo" style="font-size:30px">房间 <span id="lobbyRoom">----</span></div>
  <div class="subtitle" id="lobbySub">等待伙伴钻入（<span id="lobbyCount">1</span>/6）· 截图房间号分享出去</div>
  <div class="players" id="lobbyPlayers"></div>
  <div class="mode-box">
    <div class="mode-title">选择游戏模式</div>
    <div class="mode-row" id="modeRow">
      <button class="mode-btn" data-mode="vote"><b>投票</b><span>共享一局·大家投票抉择命运</span></button>
      <button class="mode-btn" data-mode="coop"><b>投票&amp;合作</b><span>共享一局·60秒没选自动替你选</span></button>
      <button class="mode-btn" data-mode="race"><b>竞赛</b><span>每人独立蛆·比谁活得久</span></button>
    </div>
  </div>
  <button class="btn" id="startBtn">开始这一局（房主）</button>
  <div class="hint" id="lobbyHint">只有房主可以开始</div>
</div>

<!-- 结算 -->
<div class="overlay hidden" id="result">
  <div class="res-title">✦ 终章 · 生平日志</div>
  <div class="res-sub" id="resSub"></div>
  <div class="end-title" id="endTitle"></div>
  <div class="chronicle" id="chronicle"></div>
  <div class="ver-list" id="verList"></div>
  <button class="btn" id="restartBtn">再来一局（房主）</button>
  <button class="btn secondary" id="leaveBtn">返回大厅</button>
</div>

<div id="toast"></div>

<script src="client.js"></script>
</body>
</html>
