<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蛆生 · 一条蛆的生存物语</title>
<link rel="icon" href="data:,">

<style>
  :root{
    --bg:#0e0c08; --panel:#1c1810; --ink:#ecdfc6; --muted:#9c8c72;
    --line:#3a2c1c; --accent:#d9a441; --accent2:#8a6d2f;
    --win:#7fd97f; --die:#ff8a6b; --bar:#2a2014;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:radial-gradient(120% 120% at 50% 0%,#241b12 0%,#0e0c08 100%);
    color:var(--ink); font-family:"Noto Serif CJK SC",STKaiti,KaiTi,Georgia,serif; overflow:hidden;}

  /* 顶栏 */
  #topbar{display:flex; align-items:center; gap:10px; padding:8px 12px;
    border-bottom:1px solid var(--line); background:rgba(28,24,16,.7);}
  #topbar .logo{font-size:18px; font-weight:800; color:var(--accent); letter-spacing:2px;
    text-shadow:0 2px 12px rgba(217,164,65,.35);}
  #topbar .logo .ico{display:inline-block; filter:brightness(0) invert(1);}
  #topbar .spacer{margin-left:auto;}
  .mp-link{font-family:inherit; font-size:12px; color:var(--accent); text-decoration:none;
    border:1px solid var(--accent2); border-radius:8px; padding:5px 11px; white-space:nowrap;
    background:rgba(217,164,65,.08); transition:border-color .15s, transform .08s;}
  .mp-link:hover{border-color:var(--accent); transform:translateY(-1px);}

  /* 状态栏 */
  #hud{display:flex; gap:12px; align-items:center; padding:8px 14px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:rgba(0,0,0,.2);}
  .stat{display:flex; flex-direction:column; min-width:62px;}
  .stat .lab{font-size:10px; color:var(--muted); letter-spacing:1px;}
  .stat .val{font-size:17px; font-weight:bold; color:var(--accent);}
  .bar{height:5px; border-radius:3px; background:var(--bar); margin-top:3px; overflow:hidden; width:62px;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .3s;}
  .bar.low i{background:linear-gradient(90deg,#a8432a,var(--die));}
  .bar.high i{background:linear-gradient(90deg,#a8432a,var(--die));}
  .bar.full i{background:linear-gradient(90deg,#3f8a3f,var(--win));}

  /* 主体 */
  #main{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; padding:14px; gap:8px;}
  #scene{white-space:pre-line; line-height:1.7; font-size:14.5px; color:var(--ink);
    background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:11px 14px; min-height:74px;
    max-height:32vh; overflow-y:auto; flex-shrink:0;}
  #scene .lead{margin:0;}

  .events-box{margin-top:8px; background:rgba(0,0,0,.22); border:1px solid var(--line);
    border-radius:9px; padding:7px 11px; flex-shrink:0;}
  .events-box .eb-head{font-size:12px; color:var(--accent); margin-bottom:5px;}
  .events-box .eb-list{display:flex; flex-wrap:wrap; gap:6px;}
  .events-box .eb-tag{font-size:11.5px; color:var(--accent); border:1px solid var(--accent2);
    border-radius:6px; padding:2px 8px; background:rgba(217,164,65,.08);}
  .events-box .eb-empty{font-size:12px; color:var(--muted);}

  #actions{flex-shrink:0; display:flex; flex-direction:column; gap:7px;}
  .choices{display:flex; flex-direction:column; gap:5px;}
  .situations{display:flex; flex-direction:column; gap:9px;}
  .sit-head{font-size:12.5px; color:var(--accent); margin-top:4px;}
  .situation{background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:9px; padding:9px 12px;}
  .sit-prompt{font-size:13px; color:var(--ink); margin-bottom:7px; line-height:1.55;}

  /* 选择卡片（缩短） */
  .choice{font-family:inherit; text-align:left; padding:5px 9px; border-radius:7px; line-height:1.3;
    border:1px solid var(--line); background:linear-gradient(135deg,rgba(217,164,65,.14),rgba(138,109,47,.08));
    color:var(--ink); font-size:12.5px; cursor:pointer; transition:transform .08s, border-color .15s;
    display:flex; justify-content:space-between; gap:6px; align-items:center;}
  .choice:hover{border-color:var(--accent); transform:translateY(-1px);}
  .choice .tag{font-size:9px; color:var(--accent); border:1px solid var(--accent2); border-radius:5px; padding:0 5px; white-space:nowrap;}

  #log{flex:1 1 auto; min-height:0; overflow-y:auto; margin-top:6px; padding-right:4px;
    border-top:1px solid var(--line); padding-top:8px;}
  .log-line{font-size:12.5px; line-height:1.6; color:var(--ink); padding:2px 0; border-bottom:1px dotted rgba(58,44,28,.5);}
  .log-line.win{color:var(--win);} .log-line.die{color:var(--die);}

  /* 覆盖层 / 弹窗（事件·结算·终章） */
  .overlay{position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(40,30,20,.94), rgba(14,12,8,.98));
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; padding:20px; overflow-y:auto;}
  .modal{position:relative; overflow:visible; max-width:460px; width:100%;
    background:linear-gradient(135deg,rgba(28,24,16,.96),rgba(14,12,8,.96));
    border:1px solid var(--line); border-radius:14px; padding:18px 22px; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .modal-title{font-size:19px; font-weight:800; color:var(--accent); letter-spacing:1px;}
  .modal-sub{font-size:12px; color:var(--muted); margin:4px 0 12px;}
  .modal-ok{font-family:inherit; margin-top:14px; padding:9px 24px; border-radius:9px; border:none;
    font-size:14px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a1206;}

  /* 周遭骤变：事件卡片 */
  .ev-trigger{background:rgba(0,0,0,.3); border-left:3px solid var(--accent); border-radius:8px;
    padding:8px 12px; margin:8px 0; text-align:left;}
  .ev-cat{font-size:11px; letter-spacing:1px; margin-bottom:2px;}
  .ev-name{font-size:15px; font-weight:800; margin-bottom:3px;}
  .ev-msg{font-size:12.5px; color:var(--ink); line-height:1.55;}
  .ev-delta{font-size:12px; color:var(--accent); margin-top:5px; font-weight:bold;}
  .trig-events{display:flex; flex-direction:column; gap:10px;}
  .trig-event{background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:10px; padding:10px 13px;}
  .sit-choices{margin-top:8px;}

  /* 属性结算 */
  .oc-list{display:flex; flex-direction:column; gap:7px; text-align:left;}
  .oc-row{display:flex; align-items:center; gap:10px; font-size:13.5px; background:rgba(0,0,0,.25);
    border-radius:8px; padding:7px 12px;}
  .oc-name{color:var(--muted); min-width:42px;}
  .oc-val{font-variant-numeric:tabular-nums; flex:1; text-align:center;}
  .oc-delta{min-width:54px; text-align:right; font-weight:bold;}
  .oc-row.up .oc-delta{color:var(--win);}
  .oc-row.down .oc-delta{color:var(--die);}
  .oc-row.same .oc-delta{color:var(--muted);}

  /* 终章 */
  .finale-modal{max-width:560px; text-align:left;}
  .finale-modal .modal-title{text-align:center;}
  .finale-modal .modal-sub{text-align:center;}
  .end-title{font-size:18px; text-align:center; margin:6px 0 14px; color:var(--accent);}
  .end-title.end-win{color:var(--win);} .end-title.end-bad{color:var(--die);}
  .chronicle{text-align:left; max-height:34vh; overflow-y:auto; background:rgba(0,0,0,.3);
    border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:12px;}
  .chronicle .ch-title{color:var(--accent); font-size:13px; margin-bottom:8px;}
  .chronicle .ch-item{font-size:13px; line-height:1.7; color:var(--ink);}
  .ver-list{text-align:left; max-height:20vh; overflow-y:auto; background:rgba(0,0,0,.22);
    border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin-bottom:12px;}
  .ver-list .v-title{color:var(--accent); font-size:12px; margin-bottom:6px;}
  .ver-list .v-item{font-size:12px; color:var(--muted); line-height:1.6;}
  .finale-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  /* 发光蛆绕圈特效（事件/结算/终章 modal 通用） */
  .reveal-worm{position:absolute; font-size:21px; line-height:1; left:50%; top:-14px;
    filter:brightness(0) invert(1) drop-shadow(0 0 7px #fff) drop-shadow(0 0 13px #bfe);
    pointer-events:none; animation:wormOrbitModal 2.4s linear infinite;}
  @keyframes wormOrbitModal{
    0%   {top:-14px; left:50%;   transform:translateX(-50%) rotate(0deg);}
    25%  {top:50%;  left:calc(100% + 6px); transform:translateY(-50%) rotate(90deg);}
    50%  {top:calc(100% + 6px); left:50%; transform:translateX(-50%) rotate(180deg);}
    75%  {top:50%;  left:-14px; transform:translateY(-50%) rotate(270deg);}
    100% {top:-14px; left:50%;  transform:translateX(-50%) rotate(360deg);}
  }

  @media (max-width:560px){
    #topbar .logo{font-size:15px;}
    .stat{min-width:52px;} .bar{width:52px;}
    #scene{font-size:13.5px;}
  }
</style>
</head>
<body>
  <div id="topbar">
    <span class="logo"><span class="ico">🪱</span> 蛆生</span>
    <span class="spacer"></span>
    <a class="mp-link" href="/qusheng/mp/" target="_blank" rel="noopener">🔗 联机版（房主制多人）</a>
  </div>

  <div id="hud">
    <div class="stat"><span class="lab">体力</span><span class="val" id="vFood">20</span><div class="bar" id="bFood"><i style="width:20%"></i></div></div>
    <div class="stat"><span class="lab">体型</span><span class="val" id="vGrow">1</span><div class="bar" id="bGrow"><i style="width:1%"></i></div></div>
    <div class="stat"><span class="lab">探索</span><span class="val" id="vExp">0</span><div class="bar" id="bExp"><i style="width:0%"></i></div></div>
    <div class="stat"><span class="lab">天数</span><span class="val" id="vDay">0</span></div>
    <div class="stat"><span class="lab">版本</span><span class="val" id="vVer" style="font-size:14px">v1.8</span></div>
  </div>

  <div id="main">
    <div id="scene">…</div>
    <div id="actions"></div>
    <div id="log"></div>
  </div>

<script src="game.browser.js"></script>
<script>
/* 发光蛆绕圈：包裹原版弹窗函数，给 modal 注入绕圈的🪱 */
(function(){
  function wormify(modal){
    if(!modal || modal.querySelector('.reveal-worm')) return;
    const w=document.createElement('span');
    w.className='reveal-worm'; w.textContent='🪱';
    modal.appendChild(w);
  }
  function lastOverlay(){ const o=document.querySelectorAll('.overlay'); return o.length?o[o.length-1]:null; }

  const _presentTrigger = window.presentTrigger;
  window.presentTrigger = function(after){
    _presentTrigger(after);
    const ov=lastOverlay(); if(ov) wormify(ov.querySelector('.modal'));
  };
  const _showOutcome = window.showOutcome;
  window.showOutcome = function(title, before, onConfirm){
    _showOutcome(title, before, onConfirm);
    const ov=lastOverlay(); if(ov) wormify(ov.querySelector('.modal'));
  };
  const _finale = window.finale;
  window.finale = function(reason, isWin){
    _finale(reason, isWin);
    const ov=lastOverlay(); if(ov) wormify(ov.querySelector('.modal'));
  };

  /* 启动单玩家一局 */
  window.addEventListener('DOMContentLoaded', function(){
    if(typeof resetGame==='function') resetGame();
  });
})();
</script>
</body>
</html>
