<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地区图集 · 三维地图集 | REGIONS</title>
<style>
  :root{
    --bg:#060b10;
    --panel:rgba(11,20,27,.78);
    --line:rgba(206,176,120,.20);
    --line-strong:rgba(224,193,137,.46);
    --gold:#d9b979;
    --gold-bright:#f3dda9;
    --text:#ece6d8;
    --muted:#a79c89;
    --faint:#7d7465;
    --teal:#6fb6c0;
    --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);}
  body{
    font-family:var(--sans);color:var(--text);
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(24,46,60,.85) 0%, rgba(9,17,25,.92) 46%, #05090d 100%),
      #05090d;
    min-height:100vh;
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(111,182,192,.045) 0 1px, transparent 1px 96px),
      repeating-linear-gradient(90deg, rgba(111,182,192,.045) 0 1px, transparent 1px 96px);
    mask-image:radial-gradient(80% 70% at 50% 30%, #000 20%, transparent 100%);
    -webkit-mask-image:radial-gradient(80% 70% at 50% 30%, #000 20%, transparent 100%);
  }
  body:after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(115% 100% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
  }
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:64px 28px 56px;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    padding-bottom:22px;border-bottom:1px solid var(--line);}
  .brandline{font-size:10px;letter-spacing:.34em;color:var(--gold);opacity:.78;text-transform:uppercase;}
  h1{font-family:var(--serif);font-weight:600;font-size:36px;letter-spacing:.14em;margin:10px 0 0;}
  h1 em{font-style:normal;color:var(--gold-bright);}
  .subline{margin-top:9px;font-size:12px;letter-spacing:.16em;color:var(--muted);}
  .head-note{text-align:right;font-size:10.5px;line-height:1.9;color:var(--faint);letter-spacing:.08em;white-space:nowrap;}
  .head-note b{display:block;color:var(--gold);font-weight:500;letter-spacing:.2em;font-size:9.5px;margin-bottom:4px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:30px;}
  .card{
    position:relative;display:flex;flex-direction:column;min-height:330px;
    padding:22px 22px 18px;border:1px solid var(--line);border-radius:4px;
    background:linear-gradient(160deg, rgba(16,27,36,.86), rgba(7,13,18,.80));
    box-shadow:0 18px 44px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.04);
    text-decoration:none;color:inherit;overflow:hidden;
    transition:transform .28s cubic-bezier(.22,.8,.22,1), border-color .28s, box-shadow .28s;
  }
  .card:before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:radial-gradient(90% 60% at 78% 0%, rgba(111,182,192,.13), transparent 68%);
  }
  .card .idx{position:absolute;right:18px;top:16px;font-family:var(--serif);font-size:12px;
    letter-spacing:.18em;color:rgba(217,185,121,.6);}
  .card .tag{align-self:flex-start;font-size:9.5px;letter-spacing:.18em;padding:3px 8px;border-radius:2px;}
  .tag.inferred{color:#e0b47c;border:1px dashed rgba(224,180,124,.45);background:rgba(224,180,124,.07);}
  .tag.real{color:#8fd0b6;border:1px solid rgba(143,208,182,.4);background:rgba(143,208,182,.09);}
  .card h2{font-family:var(--serif);font-weight:600;font-size:27px;letter-spacing:.08em;margin:16px 0 3px;}
  .card .en{font-size:9.5px;letter-spacing:.24em;color:var(--faint);}
  .card p.desc{margin:15px 0 0;font-size:12px;line-height:1.95;color:#c3baa9;text-align:justify;}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px;}
  .card .meta span{font-size:9.5px;letter-spacing:.06em;color:#9aa9a6;border:1px solid rgba(155,188,192,.22);
    background:rgba(95,132,137,.10);padding:3px 7px;border-radius:2px;}
  .card .warn{margin-top:auto;padding-top:15px;font-size:10.5px;line-height:1.7;color:#8b8274;
    border-top:1px dashed rgba(206,176,120,.16);}
  .card .go{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
    font-size:11px;letter-spacing:.18em;color:var(--gold-bright);}
  .card .go .arrow{font-family:var(--serif);font-size:15px;transition:transform .28s;}
  .card.ready{cursor:pointer;}
  .card.ready:hover{transform:translateY(-3px);border-color:var(--line-strong);
    box-shadow:0 26px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(224,193,137,.12) inset;}
  .card.ready:hover .go .arrow{transform:translateX(5px);}
  .card.building{cursor:not-allowed;opacity:.62;}
  .card.building .go{color:#7d7465;}

  footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
    font-size:10.5px;line-height:1.8;color:var(--faint);letter-spacing:.06em;}
  footer b{color:var(--gold);font-weight:500;letter-spacing:.14em;}
  .data-link{display:inline-flex;align-items:center;gap:6px;margin-top:9px;
    font-size:10.5px;letter-spacing:.14em;color:var(--gold);text-decoration:none;
    border:1px solid var(--line);border-radius:2px;padding:5px 10px;background:var(--panel);
    transition:color .2s,border-color .2s;}
  .data-link:hover{color:var(--gold-bright);border-color:var(--line-strong);}
  @media (max-width:760px){
    .wrap{padding:38px 18px 40px;}
    header{flex-direction:column;align-items:flex-start;}
    .head-note{text-align:left;white-space:normal;}
    h1{font-size:27px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brandline">REGIONS · 3D ATLAS</div>
      <h1>选择<em>地区</em></h1>
      <div class="subline">先选地区，再进入三维地图</div>
    </div>
    <div class="head-note">
      <b>离线运行</b>
      地形 / 水系 / 建筑数据均已本地打包<br>
      页面不联网，也不依赖后端服务
    </div>
  </header>

  <main class="grid" id="region-grid"></main>

  <footer>
    <div><b>数据说明</b>　地形来自公开 DEM；水系与建筑轮廓来自 © OpenStreetMap contributors（ODbL）。<br>
      「幻想 1 号」为推测性复原，巴黎 / 悉尼按真实数据重建，精度差异在各页内单独标注。<br>
      <a class="data-link" href="data-sources.html">数据来源与许可 ›</a></div>
    <div><b>新增地区</b>　在 <code>js/regions.js</code> 追加一项并放入对应页面即可。</div>
  </footer>
</div>

<script src="js/regions.js"></script>
<script>
(function () {
  var list = window.ATLAS_REGIONS || [];
  var grid = document.getElementById('region-grid');

  list.forEach(function (r, i) {
    var ready = r.status === 'ready';
    var el = document.createElement(ready ? 'a' : 'div');
    el.className = 'card ' + (ready ? 'ready' : 'building');
    if (ready) el.href = r.page;

    var meta = (r.meta || []).map(function (m) { return '<span>' + m + '</span>'; }).join('');
    el.innerHTML =
      '<span class="idx">' + (i + 1 < 10 ? '0' : '') + (i + 1) + ' / ' + (list.length < 10 ? '0' : '') + list.length + '</span>' +
      '<span class="tag ' + (r.tag === '真实数据' ? 'real' : 'inferred') + '">' + r.tag + '</span>' +
      '<h2>' + r.name + '</h2>' +
      '<div class="en">' + r.en + '</div>' +
      '<p class="desc">' + r.desc + '</p>' +
      '<div class="meta">' + meta + '</div>' +
      '<div class="warn">' + r.warn + '</div>' +
      '<div class="go"><span>' + (ready ? '进入地图' : '数据准备中') + '</span><span class="arrow">' + (ready ? '→' : '·') + '</span></div>';
    grid.appendChild(el);
  });
})();
</script>
</body>
</html>
